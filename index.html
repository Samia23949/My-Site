<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Site</title>
    <style>
        body{
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       nav{
        display: flex;
        flex-direction:row;
        justify-content: space-between;
        background-color: blueviolet;
        color: #ffffff;
        align-items: center;
        height: 5rem;
       } 
       #Logo{
        font-size: 2rem;
        padding-left: 23px;
       }
     ul {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
       }
       li{
        padding: 2rem;
        list-style: none;
        font-size: 1.3rem;
       }
       #banner{
        height: 50%;
        width: 100%;
        
       }
     @media  (max-width: 700px)  {
      #logo{
        font-size: 1.3rem ;
      }
      li{
        font-size: 0.9rem;
      }
}     
       
    </style>
</head>
<body>
    <header>
        <nav>
            <div id="Logo">
            <h2>First Site</h2>
            </div>
                 <ul>
                    <li>Home</li>
                    <li>About Us</li>
                    <li>Contact Us</li>
                 </ul>
        </nav>
        <div>
            <div id="banner">
                <img src="web-banner-gen_41a333b2-6e01-45eb-9a16-a51bbd7d4751.webp" alt="banner">
            </div>
        </div>
    </header>
</body>
</html>
